<!doctype html>
<html lang="ar" dir="rtl" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>التاجر الذكي (بقالة) - إدارة البقالة والسوبرماركت</title>
    
    <script>
      // Clean up any stale service workers or conflicting caches in development environments
      if (window.location.hostname.includes('ais-dev-') || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
      }
    </script>
    
    <!-- PWA & Mobile Home Screen Meta Tags -->
    <link rel="manifest" id="pwa-manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="التاجر الذكي (بقالة)" />
    <link rel="apple-touch-icon" href="/icon.jpg" />
    <link rel="icon" type="image/jpeg" href="/icon.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap">
    </noscript>
  </head>
  <body class="font-['Cairo',system-ui,sans-serif] bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white">
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background-color:#0f172a;color:#ffffff;font-family:system-ui,-apple-system,sans-serif;direction:rtl;padding:20px;text-align:center;">
        <img src="/icon.jpg" alt="التاجر الذكي" style="width:88px;height:88px;border-radius:22px;margin-bottom:16px;box-shadow:0 12px 30px rgba(0,0,0,0.4);" />
        <h1 style="font-size:22px;font-weight:700;margin:0 0 8px 0;color:#ffffff;">التاجر الذكي</h1>
        <p style="font-size:14px;color:#94a3b8;margin:0 0 20px 0;">نظام المحاسبة وإدارة المحلات</p>
        <div id="loading-spinner" style="width:36px;height:36px;border:3px solid rgba(255,255,255,0.1);border-top-color:#6366f1;border-radius:50%;animation:spin 0.8s linear infinite;"></div>
        <div id="offline-notice" style="display:none;margin-top:20px;max-width:320px;background-color:#1e293b;border:1px solid #334155;padding:16px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,0.3);">
          <p style="font-size:13px;color:#cbd5e1;line-height:1.6;margin:0 0 12px 0;">
            إذا كانت هذه أول مرة تفتح فيها الرابط الجديد، يرجى تشغيل الإنترنت لمدة 5 ثوانٍ لتنزيل ملفات التطبيق وحفظها في الهاتف للعمل بدون إنترنت دائماً.
          </p>
          <button onclick="window.location.reload()" style="background-color:#4f46e5;color:#ffffff;border:none;padding:10px 18px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;">تحديث الصفحة</button>
        </div>
        <style>@keyframes spin { to { transform: rotate(360deg); } }</style>
        <script>
          setTimeout(function() {
            var notice = document.getElementById('offline-notice');
            if (notice) notice.style.display = 'block';
          }, 4500);
        </script>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
